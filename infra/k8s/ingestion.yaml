apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: binfinity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: binfinity/python:latest
          command: ["python", "-m", "ingestion.worker"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: binfinity-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: binfinity-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@timescaledb:5432/binfinity"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: binfinity
spec:
  selector:
    app: ingestion
  ports:
    - port: 8001
      targetPort: 8001
