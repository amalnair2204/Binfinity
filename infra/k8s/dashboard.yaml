apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: binfinity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: binfinity/dashboard:latest
          ports:
            - containerPort: 3001
          env:
            - name: NEXT_PUBLIC_API_BASE
              value: "http://ingestion:8001"
            - name: NEXT_PUBLIC_ML_API
              value: "http://ml:8003"
            - name: NEXT_PUBLIC_ROUTING_API
              value: "http://routing:8005"
            - name: NEXT_PUBLIC_CALIBRATION_API
              value: "http://feedback:8006"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://ingestion:8001"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: binfinity
spec:
  selector:
    app: dashboard
  ports:
    - port: 3000
      targetPort: 3001
  type: LoadBalancer
